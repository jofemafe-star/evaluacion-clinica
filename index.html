<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Evaluación Clínica Universitaria</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F7F6F3; color: #1A1A1A; min-height: 100vh; }
  textarea, input, select, button { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #f1f1f1; } ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

const LEVELS = [
  { label: "Insuficiente", score: 1, color: "#A32D2D", bg: "#FCEBEB" },
  { label: "En desarrollo", score: 2, color: "#BA7517", bg: "#FAEEDA" },
  { label: "Competente", score: 3, color: "#0F6E56", bg: "#E1F5EE" },
  { label: "Excelente", score: 4, color: "#3C3489", bg: "#EEEDFE" },
];

const CATEGORIES = [
  { id: "anamnesis", title: "Anamnesis / Historia clínica", icon: "📋", criteria: ["Recoge motivo de consulta y antecedentes", "Realiza preguntas abiertas y estructuradas", "Documenta correctamente la información"] },
  { id: "exploracion", title: "Exploración física", icon: "🩺", criteria: ["Aplica técnicas de exploración correctamente", "Sigue un orden sistemático", "Interpreta los hallazgos con precisión"] },
  { id: "razonamiento", title: "Razonamiento diagnóstico", icon: "🧠", criteria: ["Formula hipótesis diagnósticas adecuadas", "Justifica el diagnóstico con evidencia", "Propone un plan de actuación coherente"] },
  { id: "comunicacion", title: "Comunicación con el paciente", icon: "💬", criteria: ["Usa lenguaje claro y adaptado", "Mantiene escucha activa y empatía", "Informa sobre diagnóstico y tratamiento"] },
  { id: "seguridad", title: "Normas de seguridad", icon: "🛡️", criteria: ["Cumple protocolos de higiene y asepsia", "Identifica y gestiona riesgos clínicos", "Aplica medidas de protección"] },
  { id: "ergonomia", title: "Ergonomía", icon: "🪑", criteria: ["Mantiene postura correcta", "Organiza el espacio adecuadamente", "Minimiza riesgos físicos"] },
  { id: "resultado", title: "Resultado del tratamiento", icon: "✅", criteria: ["Alcanza los objetivos terapéuticos", "Evalúa la respuesta del paciente", "Propone seguimiento y ajustes"] },
];

const emptyScores = () => Object.fromEntries(CATEGORIES.map(c => [c.id, Object.fromEntries(c.criteria.map((_, i) => [i, null]))]));
const emptyComments = () => Object.fromEntries(CATEGORIES.map(c => [c.id, ""]));

function generateSessions(year) {
  const sessions = [], cur = new Date(year, 8, 1), end = new Date(year + 1, 4, 31);
  while (cur <= end) {
    const dow = cur.getDay();
    if (dow === 2 || dow === 5) sessions.push({ id: cur.toISOString().slice(0,10), date: new Date(cur), status: "pendiente", studentScores: emptyScores(), professorScores: emptyScores(), studentComments: emptyComments(), professorComments: emptyComments(), feedback: "" });
    cur.setDate(cur.getDate() + 1);
  }
  return sessions;
}

const calcAvg = (scores, catId, criteria) => { const v = criteria.map((_,i) => scores[catId]?.[i]).filter(x => x !== null); return v.length ? +(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2) : null; };
const calcTotal = (scores) => { let t=0,c=0; CATEGORIES.forEach(cat=>cat.criteria.forEach((_,i)=>{ if(scores[cat.id]?.[i]!==null){t+=scores[cat.id][i];c++;} })); return c>0?+(t/c).toFixed(2):null; };
const scoreColor = s => { if(s===null||s===undefined) return "#888"; if(s>=3.5) return "#3C3489"; if(s>=2.5) return "#0F6E56"; if(s>=1.5) return "#BA7517"; return "#A32D2D"; };
const scoreBg = s => { if(s===null||s===undefined) return "#F0EFEC"; if(s>=3.5) return "#EEEDFE"; if(s>=2.5) return "#E1F5EE"; if(s>=1.5) return "#FAEEDA"; return "#FCEBEB"; };
const fmtDate = d => d.toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"});

function exportCSV(session, studentInfo) {
  const rows = [["EVALUACIÓN CLÍNICA — SESIÓN"],["Fecha:",session.id],["Estudiante:",studentInfo.nombre||"—"],["Asignatura:",studentInfo.asignatura||"—"],[],["Categoría","Criterio","Estudiante","Profesor"]];
  CATEGORIES.forEach(cat => {
    cat.criteria.forEach((crit,i) => { const s=session.studentScores[cat.id]?.[i]; const p=session.professorScores[cat.id]?.[i]; rows.push([cat.title,crit,s??"—",p??"—"]); });
    rows.push(["","MEDIA",calcAvg(session.studentScores,cat.id,cat.criteria)??"—",calcAvg(session.professorScores,cat.id,cat.criteria)??"—"],[]);
  });
  rows.push(["NOTA GLOBAL","",calcTotal(session.studentScores)??"—",calcTotal(session.professorScores)??"—"]);
  if(session.feedback) rows.push([],["Feedback del profesor:",session.feedback]);
  const bom="\uFEFF", ws=rows.map(r=>r.map(c=>{const v=String(c??""); return v.includes(",")?`"${v}"`:v;}).join(",")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([bom+ws],{type:"text/csv;charset=utf-8;"}));
  a.download=`sesion_${session.id}_${(studentInfo.nombre||"estudiante").replace(/\s+/g,"_")}.csv`; a.click();
}

function Pill({children,color,bg,small}) {
  return <span style={{display:"inline-block",padding:small?"2px 8px":"4px 12px",borderRadius:20,background:bg,color,fontSize:small?11:12,fontWeight:500}}>{children}</span>;
}
function StatusBadge({status}) {
  const m={pendiente:["#BA7517","#FAEEDA","Pendiente"],completada:["#0F6E56","#E1F5EE","Completada"],cancelada:["#888780","#F1EFE8","Cancelada"]};
  const [c,bg,label]=m[status]||m.pendiente;
  return <Pill color={c} bg={bg} small>{label}</Pill>;
}

function CategoryEval({cat,scores,comments,onScore,onComment,accentColor}) {
  const [open,setOpen]=useState(false);
  const avg=calcAvg(scores,cat.id,cat.criteria);
  return (
    <div style={{border:"0.5px solid #E0DDD8",borderRadius:12,marginBottom:8,overflow:"hidden",background:"#fff"}}>
      <button onClick={()=>setOpen(o=>!o)} style={{width:"100%",background:"none",border:"none",padding:"11px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
        <span style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:18}}>{cat.icon}</span>
          <span style={{fontSize:13,fontWeight:500,color:"#1A1A1A"}}>{cat.title}</span>
        </span>
        <span style={{display:"flex",alignItems:"center",gap:8}}>
          {avg!==null&&<Pill color={scoreColor(avg)} bg={scoreBg(avg)} small>{avg.toFixed(1)}/4</Pill>}
          <span style={{fontSize:11,color:"#888"}}>{open?"▲":"▼"}</span>
        </span>
      </button>
      {open&&(
        <div style={{padding:"0 14px 14px",borderTop:"0.5px solid #E0DDD8"}}>
          {cat.criteria.map((crit,i)=>(
            <div key={i} style={{marginTop:12}}>
              <p style={{fontSize:12,color:"#555",marginBottom:6}}>{crit}</p>
              <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                {LEVELS.map(lvl=>{const sel=scores[cat.id]?.[i]===lvl.score; return(
                  <button key={lvl.score} onClick={()=>onScore(cat.id,i,lvl.score)} style={{padding:"4px 11px",fontSize:11,borderRadius:20,border:sel?`1.5px solid ${lvl.color}`:"0.5px solid #E0DDD8",background:sel?lvl.bg:"#fff",color:sel?lvl.color:"#555",fontWeight:sel?500:400,cursor:"pointer"}}>{lvl.label}</button>
                );})}
              </div>
            </div>
          ))}
          <textarea value={comments[cat.id]||""} onChange={e=>onComment(cat.id,e.target.value)} placeholder="Comentarios..."
            style={{marginTop:10,width:"100%",minHeight:50,fontSize:12,padding:"7px 9px",borderRadius:8,border:"0.5px solid #E0DDD8",background:"#F7F6F3",color:"#1A1A1A",resize:"vertical"}}/>
        </div>
      )}
    </div>
  );
}

function App() {
  const [screen,setScreen]=useState("login");
  const [role,setRole]=useState(null);
  const [studentInfo,setStudentInfo]=useState({nombre:"",asignatura:"",year:new Date().getFullYear()});
  const [sessions,setSessions]=useState([]);
  const [activeSession,setActiveSession]=useState(null);
  const [evalTab,setEvalTab]=useState("student");
  const [mainTab,setMainTab]=useState("agenda");
  const [agendaMonth,setAgendaMonth]=useState(0);

  const handleStart=(r)=>{ setRole(r); setSessions(generateSessions(parseInt(studentInfo.year))); setScreen("main"); setMainTab("agenda"); };
  const updateSession=(id,patch)=>setSessions(prev=>prev.map(s=>s.id===id?{...s,...patch}:s));

  const sessionsByMonth=useMemo(()=>{ const g={}; sessions.forEach(s=>{ const k=`${s.date.getFullYear()}-${s.date.getMonth()}`; if(!g[k])g[k]=[]; g[k].push(s); }); return Object.values(g); },[sessions]);
  const completedSessions=sessions.filter(s=>s.status==="completada");

  const accentColor=role==="profesor"?"#1D9E75":"#534AB7";
  const accentBg=role==="profesor"?"linear-gradient(135deg,#E1F5EE,#9FE1CB)":"linear-gradient(135deg,#EEEDFE,#CFC9F7)";

  // LOGIN
  if(screen==="login") return(
    <div style={{maxWidth:480,margin:"0 auto",padding:"2.5rem 1rem"}}>
      <div style={{textAlign:"center",marginBottom:"1.5rem"}}>
        <p style={{fontSize:38,marginBottom:6}}>🏥</p>
        <p style={{fontSize:22,fontWeight:500,marginBottom:4,color:"#1A1A1A"}}>Evaluación clínica</p>
        <p style={{fontSize:13,color:"#666"}}>Gestión de prácticas universitarias</p>
      </div>
      <div style={{background:"#EEECEA",borderRadius:14,padding:"1.25rem",marginBottom:18}}>
        <p style={{fontSize:12,fontWeight:500,color:"#555",marginBottom:10}}>Datos del estudiante</p>
        {[["nombre","Nombre completo"],["asignatura","Asignatura / Rotación"]].map(([k,ph])=>(
          <input key={k} type="text" placeholder={ph} value={studentInfo[k]} onChange={e=>setStudentInfo(p=>({...p,[k]:e.target.value}))}
            style={{display:"block",width:"100%",marginBottom:8,fontSize:13,padding:"8px 11px",borderRadius:8,border:"0.5px solid #D5D2CC",background:"#fff",color:"#1A1A1A"}}/>
        ))}
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <label style={{fontSize:12,color:"#555",whiteSpace:"nowrap"}}>Año inicio</label>
          <input type="number" value={studentInfo.year} onChange={e=>setStudentInfo(p=>({...p,year:e.target.value}))}
            style={{width:90,fontSize:13,padding:"7px 10px",borderRadius:8,border:"0.5px solid #D5D2CC",background:"#fff",color:"#1A1A1A"}}/>
          <span style={{fontSize:12,color:"#888"}}>sep {studentInfo.year} – may {parseInt(studentInfo.year)+1}</span>
        </div>
      </div>
      <p style={{fontSize:12,color:"#666",textAlign:"center",marginBottom:10}}>Selecciona tu perfil</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {[["estudiante","🎓","Estudiante","Autoevaluación clínica","#3C3489","linear-gradient(135deg,#EEEDFE,#CFC9F7)"],
          ["profesor","👩‍⚕️","Profesor","Evalúa y da feedback","#085041","linear-gradient(135deg,#E1F5EE,#9FE1CB)"]].map(([id,ico,label,desc,color,grad])=>(
          <button key={id} onClick={()=>handleStart(id)} style={{background:grad,border:"none",borderRadius:14,padding:"1.25rem 1rem",cursor:"pointer",textAlign:"left"}}>
            <p style={{fontSize:26,marginBottom:6}}>{ico}</p>
            <p style={{fontSize:15,fontWeight:500,marginBottom:3,color}}>{label}</p>
            <p style={{fontSize:11,color,opacity:0.75}}>{desc}</p>
          </button>
        ))}
      </div>
    </div>
  );

  // SESSION DETAIL
  if(screen==="session"&&activeSession){
    const s=sessions.find(x=>x.id===activeSession); if(!s) return null;
    const scores=evalTab==="student"?s.studentScores:s.professorScores;
    const comments=evalTab==="student"?s.studentComments:s.professorComments;
    const setScore=(catId,i,val)=>updateSession(s.id,{[evalTab==="student"?"studentScores":"professorScores"]:{...scores,[catId]:{...scores[catId],[i]:val}}});
    const setComment=(catId,val)=>updateSession(s.id,{[evalTab==="student"?"studentComments":"professorComments"]:{...comments,[catId]:val}});
    const totalCriteria=CATEGORIES.reduce((a,c)=>a+c.criteria.length,0);
    const scoredCount=Object.values(scores).flatMap(Object.values).filter(v=>v!==null).length;
    const sTotal=calcTotal(s.studentScores); const pTotal=calcTotal(s.professorScores);
    const tabs=role==="profesor"?[["student","Alumno"],["professor","Profesor"],["feedback","Feedback"]]:[["student","Mi evaluación"],["feedback","Feedback"]];
    return(
      <div style={{maxWidth:700,margin:"0 auto",padding:"1.5rem 1rem"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <button onClick={()=>setScreen("main")} style={{background:"none",border:"0.5px solid #D5D2CC",borderRadius:8,padding:"5px 12px",cursor:"pointer",fontSize:12,color:"#555"}}>← Agenda</button>
          <div style={{flex:1}}>
            <p style={{fontSize:15,fontWeight:500,marginBottom:3,color:"#1A1A1A",textTransform:"capitalize"}}>{fmtDate(s.date)}</p>
            <StatusBadge status={s.status}/>
          </div>
          {role==="profesor"&&(
            <select value={s.status} onChange={e=>updateSession(s.id,{status:e.target.value})}
              style={{fontSize:12,padding:"5px 10px",borderRadius:8,border:"0.5px solid #D5D2CC",background:"#F7F6F3",color:"#1A1A1A",cursor:"pointer"}}>
              <option value="pendiente">Pendiente</option>
              <option value="completada">Completada</option>
              <option value="cancelada">Cancelada</option>
            </select>
          )}
        </div>
        <div style={{display:"flex",gap:5,marginBottom:16}}>
          {tabs.map(([t,label])=>(
            <button key={t} onClick={()=>setEvalTab(t)} style={{fontSize:12,padding:"7px 14px",borderRadius:20,border:"none",cursor:"pointer",fontWeight:evalTab===t?500:400,background:evalTab===t?accentColor:"#EEECEA",color:evalTab===t?"#fff":"#555"}}>{label}</button>
          ))}
        </div>
        {(evalTab==="student"||(evalTab==="professor"&&role==="profesor"))&&(<>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,padding:"9px 13px",background:"#EEECEA",borderRadius:10}}>
            <div style={{flex:1,height:7,background:"#D5D2CC",borderRadius:4,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${Math.round(scoredCount/totalCriteria*100)}%`,background:accentColor,borderRadius:4,transition:"width .3s"}}/>
            </div>
            <span style={{fontSize:11,color:"#555",fontWeight:500}}>{Math.round(scoredCount/totalCriteria*100)}%</span>
          </div>
          {CATEGORIES.map(cat=>(
            <CategoryEval key={cat.id} cat={cat} scores={scores} comments={comments} onScore={setScore} onComment={setComment} accentColor={accentColor}/>
          ))}
          {role==="profesor"&&evalTab==="professor"&&(
            <button onClick={()=>updateSession(s.id,{status:"completada"})} style={{width:"100%",marginTop:8,padding:"11px",borderRadius:12,border:"none",background:`linear-gradient(135deg,${accentColor},${accentColor}bb)`,color:"#fff",fontSize:13,fontWeight:500,cursor:"pointer"}}>
              Marcar sesión como completada ✓
            </button>
          )}
        </>)}
        {evalTab==="feedback"&&(
          <div>
            {(sTotal!==null||pTotal!==null)&&(
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
                {[["Autoevaluación",sTotal,"#534AB7","#EEEDFE"],["Evaluación profesor",pTotal,"#0F6E56","#E1F5EE"]].map(([label,val,color,bg])=>(
                  <div key={label} style={{background:bg,borderRadius:12,padding:"1rem",textAlign:"center"}}>
                    <p style={{fontSize:11,color,marginBottom:3,opacity:.8}}>{label}</p>
                    <p style={{fontSize:26,fontWeight:500,color}}>{val!==null?val:"—"}</p>
                    <p style={{fontSize:10,color,opacity:.7}}>sobre 4</p>
                  </div>
                ))}
              </div>
            )}
            {role==="profesor"?(
              <div>
                <p style={{fontSize:13,fontWeight:500,color:"#1A1A1A",marginBottom:8}}>Escribe el feedback para el alumno</p>
                <textarea value={s.feedback||""} onChange={e=>updateSession(s.id,{feedback:e.target.value})}
                  placeholder="Describe los puntos fuertes, áreas de mejora y recomendaciones..."
                  style={{width:"100%",minHeight:140,fontSize:13,padding:"10px 12px",borderRadius:10,border:"0.5px solid #D5D2CC",background:"#F7F6F3",color:"#1A1A1A",resize:"vertical",lineHeight:1.6}}/>
                <button onClick={()=>exportCSV(s,studentInfo)} style={{width:"100%",marginTop:10,padding:"11px",borderRadius:12,border:"none",background:"linear-gradient(135deg,#534AB7,#7F77DD)",color:"#fff",fontSize:13,fontWeight:500,cursor:"pointer"}}>
                  ⬇️ Descargar sesión (.csv)
                </button>
              </div>
            ):(
              s.feedback?(
                <div style={{background:"linear-gradient(135deg,#EEEDFE,#E1F5EE)",borderRadius:14,padding:"1.25rem"}}>
                  <p style={{fontSize:12,fontWeight:500,color:"#0F6E56",marginBottom:8}}>💬 Feedback del profesor</p>
                  <p style={{fontSize:14,color:"#1A1A1A",lineHeight:1.7}}>{s.feedback}</p>
                </div>
              ):(
                <div style={{textAlign:"center",padding:"2rem",color:"#aaa"}}>
                  <p style={{fontSize:28,marginBottom:8}}>⏳</p>
                  <p style={{fontSize:13}}>El profesor aún no ha escrito feedback para esta sesión.</p>
                </div>
              )
            )}
          </div>
        )}
      </div>
    );
  }

  // MAIN
  const monthSessions=sessionsByMonth[agendaMonth]||[];
  const monthDate=monthSessions[0]?.date;
  return(
    <div style={{maxWidth:700,margin:"0 auto",padding:"1.5rem 1rem"}}>
      <div style={{background:accentBg,borderRadius:16,padding:"1rem 1.25rem",marginBottom:18,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <p style={{fontSize:15,fontWeight:500,marginBottom:1,color:accentColor}}>{role==="profesor"?"👩‍⚕️ Profesor":"🎓 Estudiante"}</p>
          <p style={{fontSize:12,color:accentColor,opacity:.8}}>{studentInfo.nombre||"—"} · {studentInfo.asignatura||"—"}</p>
        </div>
        <div style={{textAlign:"right"}}>
          <p style={{fontSize:11,color:accentColor,marginBottom:2,opacity:.7}}>Sesiones completadas</p>
          <p style={{fontSize:20,fontWeight:500,color:accentColor}}>{completedSessions.length}<span style={{fontSize:12,opacity:.7}}>/{sessions.length}</span></p>
        </div>
      </div>
      <div style={{display:"flex",gap:5,marginBottom:18}}>
        {[["agenda","📅 Agenda"],["progreso","📈 Progreso"]].map(([t,label])=>(
          <button key={t} onClick={()=>setMainTab(t)} style={{fontSize:13,padding:"8px 18px",borderRadius:20,border:"none",cursor:"pointer",fontWeight:mainTab===t?500:400,background:mainTab===t?accentColor:"#EEECEA",color:mainTab===t?"#fff":"#555"}}>{label}</button>
        ))}
        <button onClick={()=>setScreen("login")} style={{marginLeft:"auto",fontSize:12,padding:"7px 14px",borderRadius:20,border:"0.5px solid #D5D2CC",background:"none",color:"#555",cursor:"pointer"}}>Salir</button>
      </div>

      {mainTab==="agenda"&&(
        <div>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <button onClick={()=>setAgendaMonth(m=>Math.max(0,m-1))} disabled={agendaMonth===0} style={{background:"none",border:"0.5px solid #D5D2CC",borderRadius:8,padding:"4px 10px",cursor:"pointer",color:"#555",fontSize:13}}>‹</button>
            <p style={{flex:1,textAlign:"center",fontWeight:500,fontSize:14,color:"#1A1A1A",textTransform:"capitalize"}}>
              {monthDate?monthDate.toLocaleDateString("es-ES",{month:"long",year:"numeric"}):"—"}
            </p>
            <button onClick={()=>setAgendaMonth(m=>Math.min(sessionsByMonth.length-1,m+1))} disabled={agendaMonth===sessionsByMonth.length-1} style={{background:"none",border:"0.5px solid #D5D2CC",borderRadius:8,padding:"4px 10px",cursor:"pointer",color:"#555",fontSize:13}}>›</button>
          </div>
          {monthSessions.map(s=>{
            const sT=calcTotal(s.studentScores); const pT=calcTotal(s.professorScores);
            return(
              <button key={s.id} onClick={()=>{setActiveSession(s.id);setEvalTab(role==="profesor"?"professor":"student");setScreen("session");}}
                style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"12px 14px",marginBottom:7,background:"#fff",border:"0.5px solid #E0DDD8",borderRadius:12,cursor:"pointer",textAlign:"left"}}>
                <div style={{width:46,height:46,borderRadius:10,background:accentBg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
                  <span style={{fontSize:16,fontWeight:500,color:accentColor,lineHeight:1}}>{s.date.getDate()}</span>
                  <span style={{fontSize:10,color:accentColor,opacity:.75,textTransform:"capitalize"}}>{s.date.toLocaleDateString("es-ES",{weekday:"short"})}</span>
                </div>
                <div style={{flex:1}}>
                  <p style={{fontSize:13,fontWeight:500,marginBottom:3,color:"#1A1A1A",textTransform:"capitalize"}}>{fmtDate(s.date)}</p>
                  <StatusBadge status={s.status}/>
                </div>
                <div style={{display:"flex",gap:6}}>
                  {sT!==null&&<Pill color={scoreColor(sT)} bg={scoreBg(sT)} small>🎓 {sT}</Pill>}
                  {pT!==null&&<Pill color={scoreColor(pT)} bg={scoreBg(pT)} small>👩‍⚕️ {pT}</Pill>}
                </div>
                <span style={{fontSize:13,color:"#aaa"}}>›</span>
              </button>
            );
          })}
        </div>
      )}

      {mainTab==="progreso"&&(
        <div>
          {completedSessions.length===0?(
            <div style={{textAlign:"center",padding:"3rem 1rem",color:"#aaa"}}>
              <p style={{fontSize:32,marginBottom:8}}>📊</p>
              <p style={{fontSize:13}}>Completa sesiones para ver la evolución.</p>
            </div>
          ):(
            <>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:20}}>
                {(()=>{
                  const sVals=completedSessions.map(s=>calcTotal(s.studentScores)).filter(Boolean);
                  const pVals=completedSessions.map(s=>calcTotal(s.professorScores)).filter(Boolean);
                  const sMedia=sVals.length?(sVals.reduce((a,b)=>a+b,0)/sVals.length).toFixed(2):"—";
                  const pMedia=pVals.length?(pVals.reduce((a,b)=>a+b,0)/pVals.length).toFixed(2):"—";
                  return[
                    ["Sesiones",completedSessions.length,accentColor,scoreBg(4)],
                    ["Media alumno",sMedia,scoreColor(parseFloat(sMedia)),scoreBg(parseFloat(sMedia))],
                    ["Media profesor",pMedia,"#0F6E56","#E1F5EE"],
                  ].map(([label,val,color,bg])=>(
                    <div key={label} style={{background:bg,borderRadius:12,padding:"1rem",textAlign:"center"}}>
                      <p style={{fontSize:11,color,marginBottom:3,opacity:.8}}>{label}</p>
                      <p style={{fontSize:22,fontWeight:500,color}}>{val}</p>
                    </div>
                  ));
                })()}
              </div>
              <p style={{fontSize:13,fontWeight:500,color:"#1A1A1A",marginBottom:10}}>Evolución por sesión</p>
              <div style={{overflowX:"auto"}}>
                <div style={{display:"flex",alignItems:"flex-end",gap:6,minWidth:completedSessions.length*44,height:120,paddingBottom:0,borderBottom:"0.5px solid #E0DDD8"}}>
                  {completedSessions.map(s=>{
                    const sT=calcTotal(s.studentScores); const pT=calcTotal(s.professorScores);
                    return(
                      <div key={s.id} style={{flex:1,minWidth:36,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                        <div style={{width:"100%",display:"flex",gap:2,alignItems:"flex-end",height:100}}>
                          {[{val:sT,color:"#534AB7"},{val:pT,color:"#1D9E75"}].map(({val,color},bi)=>(
                            <div key={bi} style={{flex:1,background:val?color+"55":"#EEE",borderRadius:"3px 3px 0 0",height:val?`${(val/4)*100}%`:"4px",minHeight:4}}/>
                          ))}
                        </div>
                        <span style={{fontSize:9,color:"#aaa",textAlign:"center"}}>{s.date.getDate()}/{s.date.getMonth()+1}</span>
                      </div>
                    );
                  })}
                </div>
                <div style={{display:"flex",gap:16,marginTop:8,fontSize:11,color:"#666"}}>
                  <span><span style={{display:"inline-block",width:10,height:10,borderRadius:2,background:"#534AB7",marginRight:4}}/>Estudiante</span>
                  <span><span style={{display:"inline-block",width:10,height:10,borderRadius:2,background:"#1D9E75",marginRight:4}}/>Profesor</span>
                </div>
              </div>
              <p style={{fontSize:13,fontWeight:500,color:"#1A1A1A",margin:"20px 0 10px"}}>Media por categoría</p>
              {CATEGORIES.map(cat=>{
                const sVals=completedSessions.map(s=>calcAvg(s.studentScores,cat.id,cat.criteria)).filter(v=>v!==null);
                const pVals=completedSessions.map(s=>calcAvg(s.professorScores,cat.id,cat.criteria)).filter(v=>v!==null);
                const sA=sVals.length?(sVals.reduce((a,b)=>a+b,0)/sVals.length):null;
                const pA=pVals.length?(pVals.reduce((a,b)=>a+b,0)/pVals.length):null;
                return(
                  <div key={cat.id} style={{marginBottom:10}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                      <span style={{fontSize:12,color:"#555"}}>{cat.icon} {cat.title}</span>
                      <span style={{fontSize:12,fontWeight:500}}>
                        {sA!==null?<span style={{color:"#534AB7"}}>🎓{sA.toFixed(1)}</span>:"—"} / {pA!==null?<span style={{color:"#1D9E75"}}>👩‍⚕️{pA.toFixed(1)}</span>:"—"}
                      </span>
                    </div>
                    <div style={{display:"flex",gap:4,height:8}}>
                      {[{val:sA,color:"#534AB7"},{val:pA,color:"#1D9E75"}].map(({val,color},i)=>(
                        <div key={i} style={{flex:1,background:"#EEECEA",borderRadius:4,overflow:"hidden"}}>
                          <div style={{height:"100%",width:val?`${(val/4)*100}%`:"0%",background:color+"99",borderRadius:4,transition:"width .3s"}}/>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
