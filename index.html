<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

const cfg={apiKey:"AIzaSyDEtVwExLEXjpOo3Qw3TAF4NA1EEWtdmjE",authDomain:"evaluacion-clinica-uv-fddea.firebaseapp.com",projectId:"evaluacion-clinica-uv-fddea",storageBucket:"evaluacion-clinica-uv-fddea.firebasestorage.app",messagingSenderId:"526283344705",appId:"1:526283344705:web:85a12269c33baf847f6fc0"};
const app=initializeApp(cfg);
window._auth=getAuth(app);
window._db=getFirestore(app);
window._fn={createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,doc,setDoc,getDoc,collection,getDocs,query,where};
window.dispatchEvent(new Event("fbReady"));

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F7F6F3;color:#1A1A1A;min-height:100vh}
textarea,input,select,button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useMemo}=React;
const LEVELS=[{label:"Insuficiente",score:1,color:"#A32D2D",bg:"#FCEBEB"},{label:"En desarrollo",score:2,color:"#BA7517",bg:"#FAEEDA"},{label:"Competente",score:3,color:"#0F6E56",bg:"#E1F5EE"},{label:"Excelente",score:4,color:"#3C3489",bg:"#EEEDFE"}];
const CATS=[{id:"anamnesis",title:"Anamnesis / Historia clínica",icon:"📋",criteria:["Recoge motivo de consulta y antecedentes","Realiza preguntas abiertas y estructuradas","Documenta correctamente la información"]},{id:"exploracion",title:"Exploración física",icon:"🩺",criteria:["Aplica técnicas de exploración correctamente","Sigue un orden sistemático","Interpreta los hallazgos con precisión"]},{id:"razonamiento",title:"Razonamiento diagnóstico",icon:"🧠",criteria:["Formula hipótesis diagnósticas adecuadas","Justifica el diagnóstico con evidencia","Propone un plan de actuación coherente"]},{id:"comunicacion",title:"Comunicación con el paciente",icon:"💬",criteria:["Usa lenguaje claro y adaptado","Mantiene escucha activa y empatía","Informa sobre diagnóstico y tratamiento"]},{id:"seguridad",title:"Normas de seguridad",icon:"🛡️",criteria:["Cumple protocolos de higiene y asepsia","Identifica y gestiona riesgos clínicos","Aplica medidas de protección"]},{id:"ergonomia",title:"Ergonomía",icon:"🪑",criteria:["Mantiene postura correcta","Organiza el espacio adecuadamente","Minimiza riesgos físicos"]},{id:"resultado",title:"Resultado del tratamiento",icon:"✅",criteria:["Alcanza los objetivos terapéuticos","Evalúa la respuesta del paciente","Propone seguimiento y ajustes"]}];
const eScores=()=>Object.fromEntries(CATS.map(c=>[c.id,Object.fromEntries(c.criteria.map((_,i)=>[i,null]))]));
const eComments=()=>Object.fromEntries(CATS.map(c=>[c.id,""]));
function genSessions(year){const s=[],cur=new Date(year,8,1),end=new Date(year+1,4,31);while(cur<=end){const d=cur.getDay();if(d===2||d===5)s.push({id:cur.toISOString().slice(0,10),date:new Date(cur),status:"pendiente",studentScores:eScores(),professorScores:eScores(),studentComments:eComments(),professorComments:eComments(),feedback:""});cur.setDate(cur.getDate()+1);}return s;}
const ser=s=>s.map(x=>({...x,date:x.date.toISOString()}));
const des=s=>s.map(x=>({...x,date:new Date(x.date)}));
const avg=(sc,id,cr)=>{const v=cr.map((_,i)=>sc[id]&&sc[id][i]!==undefined?sc[id][i]:null).filter(x=>x!==null);return v.length?+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):null};
const total=sc=>{let t=0,c=0;CATS.forEach(cat=>cat.criteria.forEach((_,i)=>{const v=sc[cat.id]&&sc[cat.id][i]!==undefined?sc[cat.id][i]:null;if(v!==null){t+=v;c++;}}));return c>0?+(t/c).toFixed(2):null};
const sCol=s=>{if(!s&&s!==0)return"#888";if(s>=3.5)return"#3C3489";if(s>=2.5)return"#0F6E56";if(s>=1.5)return"#BA7517";return"#A32D2D"};
const sBg=s=>{if(!s&&s!==0)return"#F0EFEC";if(s>=3.5)return"#EEEDFE";if(s>=2.5)return"#E1F5EE";if(s>=1.5)return"#FAEEDA";return"#FCEBEB"};
const fmt=d=>d.toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"});
const lvlName=s=>{if(s===null||s===undefined)return"—";const f=LEVELS.find(l=>l.score===s);return f?f.label:"—"};
const normAsig=s=>s?s.trim().toLowerCase():"";

function exportXLS(students,asig,year){
  const rows=[["EVALUACIÓN CLÍNICA — CURSO COMPLETO"],["Asignatura:",asig||"—","Curso:",year+"-"+(parseInt(year)+1)],["Generado:",new Date().toLocaleDateString("es-ES")],[],["RESUMEN"],["Alumno","Sesiones","Media alumno","Media profesor","Diferencia"]];
  students.forEach(st=>{const comp=st.sessions.filter(s=>s.status==="completada");const sv=comp.map(s=>total(s.studentScores)).filter(Boolean);const pv=comp.map(s=>total(s.professorScores)).filter(Boolean);const sm=sv.length?(sv.reduce((a,b)=>a+b,0)/sv.length).toFixed(2):"—";const pm=pv.length?(pv.reduce((a,b)=>a+b,0)/pv.length).toFixed(2):"—";rows.push([st.nombre,comp.length,sm,pm,(sm!=="—"&&pm!=="—")?(parseFloat(pm)-parseFloat(sm)).toFixed(2):"—"]);});
  rows.push([]);
  students.forEach(st=>{const comp=st.sessions.filter(s=>s.status==="completada");if(!comp.length)return;rows.push(["ALUMNO: "+st.nombre.toUpperCase()],[],["Categoría","Media alumno","Media profesor"]);CATS.forEach(cat=>{const sv=comp.map(s=>avg(s.studentScores,cat.id,cat.criteria)).filter(v=>v!==null);const pv=comp.map(s=>avg(s.professorScores,cat.id,cat.criteria)).filter(v=>v!==null);rows.push([cat.title,sv.length?(sv.reduce((a,b)=>a+b,0)/sv.length).toFixed(2):"—",pv.length?(pv.reduce((a,b)=>a+b,0)/pv.length).toFixed(2):"—"]);});rows.push([],["Fecha","Categoría","Criterio","Alumno","Nivel alumno","Profesor","Nivel profesor","Feedback"]);comp.forEach(s=>{CATS.forEach((cat,ci)=>{cat.criteria.forEach((cr,i)=>{const sv=s.studentScores[cat.id]?s.studentScores[cat.id][i]:null;const pv=s.professorScores[cat.id]?s.professorScores[cat.id][i]:null;rows.push([ci===0&&i===0?s.id:"",i===0?cat.title:"",cr,sv!==null?sv:"—",lvlName(sv),pv!==null?pv:"—",lvlName(pv),ci===0&&i===0?(s.feedback||""):""])});});rows.push(["","","NOTA GLOBAL",total(s.studentScores)||"—","",total(s.professorScores)||"—",""],[]);});rows.push([]);});
  const bom="\uFEFF",ws=rows.map(r=>r.map(c=>{const v=String(c!==null&&c!==undefined?c:"");return(v.includes(",")||v.includes("\n"))?'"'+v.replace(/"/g,'""')+'"':v}).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bom+ws],{type:"text/csv;charset=utf-8;"}));a.download="evaluacion_"+year+"-"+(parseInt(year)+1)+".csv";a.click();
}

function Pill({children,color,bg,small}){return React.createElement("span",{style:{display:"inline-block",padding:small?"2px 8px":"4px 12px",borderRadius:20,background:bg,color,fontSize:small?11:12,fontWeight:500}},children)}
function Badge({status}){const m={pendiente:["#BA7517","#FAEEDA","Pendiente"],completada:["#0F6E56","#E1F5EE","Completada"],cancelada:["#888","#F0EFEC","Cancelada"]};const a=m[status]||m.pendiente;return React.createElement(Pill,{color:a[0],bg:a[1],small:true},a[2])}

function CatEval({cat,scores,comments,onScore,onComment}){
  const[open,setOpen]=useState(false);const a=avg(scores,cat.id,cat.criteria);
  return(
    <div style={{border:"0.5px solid #E0DDD8",borderRadius:12,marginBottom:8,overflow:"hidden",background:"#fff"}}>
      <button onClick={()=>setOpen(o=>!o)} style={{width:"100%",background:"none",border:"none",padding:"11px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
        <span style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:18}}>{cat.icon}</span><span style={{fontSize:13,fontWeight:500}}>{cat.title}</span></span>
        <span style={{display:"flex",alignItems:"center",gap:8}}>{a!==null&&<Pill color={sCol(a)} bg={sBg(a)} small>{a.toFixed(1)}/4</Pill>}<span style={{fontSize:11,color:"#aaa"}}>{open?"▲":"▼"}</span></span>
      </button>
      {open&&<div style={{padding:"0 14px 14px",borderTop:"0.5px solid #E0DDD8"}}>
        {cat.criteria.map((cr,i)=>(
          <div key={i} style={{marginTop:12}}>
            <p style={{fontSize:12,color:"#555",marginBottom:6}}>{cr}</p>
            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              {LEVELS.map(lvl=>{const sel=scores[cat.id]&&scores[cat.id][i]===lvl.score;return<button key={lvl.score} onClick={()=>onScore(cat.id,i,lvl.score)} style={{padding:"4px 11px",fontSize:11,borderRadius:20,border:sel?"1.5px solid "+lvl.color:"0.5px solid #E0DDD8",background:sel?lvl.bg:"#fff",color:sel?lvl.color:"#555",fontWeight:sel?500:400,cursor:"pointer"}}>{lvl.label}</button>})}
            </div>
          </div>
        ))}
        <textarea value={comments[cat.id]||""} onChange={e=>onComment(cat.id,e.target.value)} placeholder="Comentarios..." style={{marginTop:10,width:"100%",minHeight:50,fontSize:12,padding:"7px 9px",borderRadius:8,border:"0.5px solid #E0DDD8",background:"#F7F6F3",color:"#1A1A1A",resize:"vertical"}}/>
      </div>}
    </div>
  );
}

function App(){
  const[ready,setReady]=useState(!!window._auth);
  const[authUser,setAuthUser]=useState(null);
  const[profile,setProfile]=useState(null);
  const[loadingAuth,setLoadingAuth]=useState(true);
  const[authMode,setAuthMode]=useState("login");
  const[email,setEmail]=useState("");
  const[pass,setPass]=useState("");
  const[nombre,setNombre]=useState("");
  const[roleSelect,setRoleSelect]=useState("estudiante");
  const[asig,setAsig]=useState("");
  const[yr,setYr]=useState(String(new Date().getFullYear()));
  const[authErr,setAuthErr]=useState("");
  const[loading,setLoading]=useState(false);
  const[saving,setSaving]=useState(false);
  const[students,setStudents]=useState([]);
  const[mySessions,setMySessions]=useState([]);
  const[activeStudentId,setActiveStudentId]=useState(null);
  const[activeSessionId,setActiveSessionId]=useState(null);
  const[screen,setScreen]=useState("main");
  const[evalTab,setEvalTab]=useState("professor");
  const[mainTab,setMainTab]=useState("alumnos");
  const[agendaMonth,setAgendaMonth]=useState(0);

  useEffect(()=>{
    if(!ready){window.addEventListener("fbReady",()=>setReady(true));return;}
    const unsub=window._fn.onAuthStateChanged(window._auth,async user=>{
      if(user){
        setAuthUser(user);
        const snap=await window._fn.getDoc(window._fn.doc(window._db,"users",user.uid));
        if(snap.exists()){
          const d=snap.data();setProfile(d);setAsig(d.asignatura||"");setYr(d.year||String(new Date().getFullYear()));
          if(d.role==="estudiante"){
            const ss=await window._fn.getDoc(window._fn.doc(window._db,"studentSessions",user.uid));
            if(ss.exists()&&ss.data().sessions){setMySessions(des(ss.data().sessions));}
            else{const ns=genSessions(parseInt(d.year||new Date().getFullYear()));setMySessions(ns);await window._fn.setDoc(window._fn.doc(window._db,"studentSessions",user.uid),{sessions:ser(ns)});}
          }
          if(d.role==="profesor")await loadStudents(d.asignatura);
        }
      } else {setAuthUser(null);setProfile(null);}
      setLoadingAuth(false);
    });
    return()=>unsub();
  },[ready]);

  const loadStudents=async(asignatura)=>{
    const q=window._fn.query(window._fn.collection(window._db,"users"),window._fn.where("role","==","estudiante"),window._fn.where("asignaturaNorm","==",normAsig(asignatura)));
    const snap=await window._fn.getDocs(q);
    const list=[];
    for(const d of snap.docs){
      const data=d.data();
      const ss=await window._fn.getDoc(window._fn.doc(window._db,"studentSessions",d.id));
      const sessions=ss.exists()&&ss.data().sessions?des(ss.data().sessions):genSessions(parseInt(data.year||new Date().getFullYear()));
      list.push({id:d.id,nombre:data.nombre,email:data.email,sessions});
    }
    setStudents(list);
  };

  const doAuth=async()=>{
    setAuthErr("");setLoading(true);
    try{
      if(authMode==="register"){
        if(!nombre.trim()){setAuthErr("Introduce tu nombre.");setLoading(false);return;}
        if(!asig.trim()){setAuthErr("Introduce la asignatura.");setLoading(false);return;}
        const cred=await window._fn.createUserWithEmailAndPassword(window._auth,email,pass);
        const pd={nombre:nombre.trim(),email,role:roleSelect,asignatura:asig.trim(),asignaturaNorm:normAsig(asig),year:yr,createdAt:new Date().toISOString()};
        await window._fn.setDoc(window._fn.doc(window._db,"users",cred.user.uid),pd);
        if(roleSelect==="estudiante"){const ns=genSessions(parseInt(yr));await window._fn.setDoc(window._fn.doc(window._db,"studentSessions",cred.user.uid),{sessions:ser(ns)});}
      } else {
        await window._fn.signInWithEmailAndPassword(window._auth,email,pass);
      }
    }catch(e){
      const m={"auth/email-already-in-use":"Correo ya registrado.","auth/wrong-password":"Contraseña incorrecta.","auth/user-not-found":"Correo no encontrado.","auth/invalid-email":"Correo no válido.","auth/weak-password":"Mínimo 6 caracteres.","auth/invalid-credential":"Correo o contraseña incorrectos."};
      setAuthErr(m[e.code]||e.message);
    }
    setLoading(false);
  };

  const doSignOut=async()=>{await window._fn.signOut(window._auth);setStudents([]);setMySessions([]);setAuthUser(null);setProfile(null);};

  const saveProf=async(sid,sessionId,patch)=>{
    const st=students.find(s=>s.id===sid);if(!st)return;
    const ns=st.sessions.map(s=>s.id===sessionId?{...s,...patch}:s);
    setStudents(prev=>prev.map(s=>s.id===sid?{...s,sessions:ns}:s));
    setSaving(true);await window._fn.setDoc(window._fn.doc(window._db,"studentSessions",sid),{sessions:ser(ns)});setSaving(false);
  };

  const saveStud=async(sessionId,patch)=>{
    const ns=mySessions.map(s=>s.id===sessionId?{...s,...patch}:s);
    setMySessions(ns);setSaving(true);
    await window._fn.setDoc(window._fn.doc(window._db,"studentSessions",authUser.uid),{sessions:ser(ns)});setSaving(false);
  };

  const role=profile&&profile.role;
  const acc=role==="profesor"?"#1D9E75":"#534AB7";
  const accBg=role==="profesor"?"linear-gradient(135deg,#E1F5EE,#9FE1CB)":"linear-gradient(135deg,#EEEDFE,#CFC9F7)";
  const activeStudent=students.find(s=>s.id===activeStudentId)||null;

  const byMonth=useMemo(()=>{
    const src=role==="profesor"?(activeStudent?activeStudent.sessions:[]):mySessions;
    const g={};src.forEach(s=>{const k=s.date.getFullYear()+"-"+s.date.getMonth();if(!g[k])g[k]=[];g[k].push(s)});
    return Object.values(g);
  },[activeStudent,mySessions,role]);

  const allS=role==="profesor"?(activeStudent?activeStudent.sessions:[]):mySessions;
  const done=allS.filter(s=>s.status==="completada");

  if(!ready||loadingAuth)return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",flexDirection:"column",gap:12}}>
      <div style={{fontSize:36}}>🏥</div><p style={{fontSize:14,color:"#666"}}>Cargando...</p>
    </div>
  );

  if(!authUser)return(
    <div style={{maxWidth:440,margin:"0 auto",padding:"2.5rem 1rem"}}>
      <div style={{textAlign:"center",marginBottom:"1.5rem"}}>
        <div style={{fontSize:38,marginBottom:6}}>🏥</div>
        <p style={{fontSize:22,fontWeight:500,marginBottom:4}}>Evaluación clínica UV</p>
        <p style={{fontSize:13,color:"#666"}}>Prácticas universitarias</p>
      </div>
      <div style={{background:"#fff",borderRadius:16,padding:"1.5rem",border:"0.5px solid #E0DDD8"}}>
        <div style={{display:"flex",gap:6,marginBottom:20}}>
          {[["login","Iniciar sesión"],["register","Registrarse"]].map(t=>(
            <button key={t[0]} onClick={()=>{setAuthMode(t[0]);setAuthErr("")}} style={{flex:1,padding:"8px",borderRadius:10,border:"none",cursor:"pointer",fontWeight:authMode===t[0]?500:400,background:authMode===t[0]?"#1A1A1A":"#EEECEA",color:authMode===t[0]?"#fff":"#555",fontSize:13}}>{t[1]}</button>
          ))}
        </div>
        {authMode==="register"&&(
          <div>
            <input type="text" placeholder="Nombre completo" value={nombre} onChange={e=>setNombre(e.target.value)} style={{display:"block",width:"100%",marginBottom:10,fontSize:13,padding:"9px 12px",borderRadius:8,border:"0.5px solid #D5D2CC",background:"#F7F6F3",color:"#1A1A1A"}}/>
            <select value={roleSelect} onChange={e=>setRoleSelect(e.target.value)} style={{display:"block",width:"100%",marginBottom:10,fontSize:13,padding:"9px 12px",borderRadius:8,border:"0.5px solid #D5D2CC",background:"#F7F6F3",color:"#1A1A1A"}}>
              <option value="estudiante">Estudiante</option>
              <option value="profesor">Profesor</option>
            </select>
            <input type="text" placeholder="Asignatura / Rotación" value={asig} onChange={e=>setAsig(e.target.value)} style={{display:"block",width:"100%",marginBottom:10,fontSize:13,padding:"9px 12px",borderRadius:8,border:"0.5px solid #D5D2CC",background:"#F7F6F3",color:"#1A1A1A"}}/>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
              <label style={{fontSize:12,color:"#555",whiteSpace:"nowrap"}}>Año inicio</label>
              <input type="number" value={yr} onChange={e=>setYr(e.target.value)} style={{width:90,fontSize:13,padding:"8px 10px",borderRadius:8,border:"0.5px solid #D5D2CC",background:"#F7F6F3",color:"#1A1A1A"}}/>
              <span style={{fontSize:11,color:"#888"}}>sep {yr}–may {parseInt(yr)+1}</span>
            </div>
          </div>
        )}
        <input type="email" placeholder="Correo electrónico" value={email} onChange={e=>setEmail(e.target.value)} style={{display:"block",width:"100%",marginBottom:10,fontSize:13,padding:"9px 12px",borderRadius:8,border:"0.5px solid #D5D2CC",background:"#F7F6F3",color:"#1A1A1A"}}/>
        <input type="password" placeholder="Contraseña (mín. 6 caracteres)" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doAuth()} style={{display:"block",width:"100%",marginBottom:14,fontSize:13,padding:"9px 12px",borderRadius:8,border:"0.5px solid #D5D2CC",background:"#F7F6F3",color:"#1A1A1A"}}/>
        {authErr&&<p style={{fontSize:12,color:"#A32D2D",marginBottom:10,padding:"8px 10px",background:"#FCEBEB",borderRadius:8}}>{authErr}</p>}
        <button onClick={doAuth} disabled={loading} style={{width:"100%",padding:"11px",borderRadius:10,border:"none",background:loading?"#ccc":"linear-gradient(135deg,#1D9E75,#0F6E56)",color:"#fff",fontSize:14,fontWeight:500,cursor:loading?"not-allowed":"pointer"}}>
          {loading?"Cargando...":(authMode==="login"?"Entrar →":"Crear cuenta →")}
        </button>
      </div>
      {authMode==="register"&&roleSelect==="estudiante"&&(
        <div style={{marginTop:12,padding:"10px 14px",background:"#EEEDFE",borderRadius:10,fontSize:12,color:"#3C3489"}}>
          💡 Escribe exactamente la misma asignatura que tu profesor para aparecer en su lista.
        </div>
      )}
    </div>
  );

  if(screen==="session"&&activeSessionId){
    const sessions=role==="profesor"?(activeStudent?activeStudent.sessions:[]):mySessions;
    const s=sessions.find(x=>x.id===activeSessionId);if(!s)return null;
    const scores=evalTab==="student"?s.studentScores:s.professorScores;
    const comments=evalTab==="student"?s.studentComments:s.professorComments;
    const setScore=(catId,i,val)=>{const key=evalTab==="student"?"studentScores":"professorScores";const p={};p[key]={...scores,[catId]:{...scores[catId],[i]:val}};role==="profesor"?saveProf(activeStudentId,s.id,p):saveStud(s.id,p)};
    const setComment=(catId,val)=>{const key=evalTab==="student"?"studentComments":"professorComments";const p={};p[key]={...comments,[catId]:val};role==="profesor"?saveProf(activeStudentId,s.id,p):saveStud(s.id,p)};
    const setFb=val=>{if(role==="profesor")saveProf(activeStudentId,s.id,{feedback:val})};
    const setSt=val=>{if(role==="profesor")saveProf(activeStudentId,s.id,{status:val})};
    const tc=CATS.reduce((a,c)=>a+c.criteria.length,0);
    const sc=Object.values(scores).flatMap(v=>Object.values(v)).filter(v=>v!==null).length;
    const sT=total(s.studentScores),pT=total(s.professorScores);
    const tabs=role==="profesor"?[["professor","Evaluación"],["student","Autoevaluación alumno"],["feedback","Feedback"]]:[["student","Mi autoevaluación"],["feedback","Feedback recibido"]];
    return(
      <div style={{maxWidth:700,margin:"0 auto",padding:"1.5rem 1rem"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <button onClick={()=>setScreen(role==="profesor"?"agenda":"main")} style={{background:"none",border:"0.5px solid #D5D2CC",borderRadius:8,padding:"5px 12px",cursor:"pointer",fontSize:12,color:"#555"}}>← Volver</button>
          <div style={{flex:1}}>
            {role==="profesor"&&activeStudent&&<p style={{fontSize:12,color:acc,fontWeight:500,marginBottom:2}}>👤 {activeStudent.nombre}</p>}
            <p style={{fontSize:15,fontWeight:500,marginBottom:3,textTransform:"capitalize"}}>{fmt(s.date)}</p>
            <Badge status={s.status}/>
          </div>
          {saving&&<span style={{fontSize:11,color:"#888"}}>💾</span>}
          {role==="profesor"&&<select value={s.status} onChange={e=>setSt(e.target.value)} style={{fontSize:12,padding:"5px 10px",borderRadius:8,border:"0.5px solid #D5D2CC",background:"#F7F6F3",color:"#1A1A1A",cursor:"pointer"}}><option value="pendiente">Pendiente</option><option value="completada">Completada</option><option value="cancelada">Cancelada</option></select>}
        </div>
        <div style={{display:"flex",gap:5,marginBottom:16,flexWrap:"wrap"}}>{tabs.map(t=><button key={t[0]} onClick={()=>setEvalTab(t[0])} style={{fontSize:12,padding:"7px 14px",borderRadius:20,border:"none",cursor:"pointer",fontWeight:evalTab===t[0]?500:400,background:evalTab===t[0]?acc:"#EEECEA",color:evalTab===t[0]?"#fff":"#555"}}>{t[1]}</button>)}</div>
        {(evalTab==="student"||evalTab==="professor")&&<div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,padding:"9px 13px",background:"#EEECEA",borderRadius:10}}>
            <div style={{flex:1,height:7,background:"#D5D2CC",borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",width:Math.round(sc/tc*100)+"%",background:acc,borderRadius:4}}/></div>
            <span style={{fontSize:11,color:"#555",fontWeight:500}}>{Math.round(sc/tc*100)}%</span>
          </div>
          {CATS.map(cat=><CatEval key={cat.id} cat={cat} scores={scores} comments={comments} onScore={setScore} onComment={setComment}/>)}
          {role==="profesor"&&evalTab==="professor"&&<button onClick={()=>setSt("completada")} style={{width:"100%",marginTop:8,padding:"11px",borderRadius:12,border:"none",background:"linear-gradient(135deg,"+acc+","+acc+"bb)",color:"#fff",fontSize:13,fontWeight:500,cursor:"pointer"}}>Marcar como completada ✓</button>}
        </div>}
        {evalTab==="feedback"&&<div>
          {(sT!==null||pT!==null)&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            {[["Autoevaluación",sT,"#534AB7","#EEEDFE"],["Evaluación profesor",pT,"#0F6E56","#E1F5EE"]].map(a=><div key={a[0]} style={{background:a[3],borderRadius:12,padding:"1rem",textAlign:"center"}}><p style={{fontSize:11,color:a[2],marginBottom:3,opacity:.8}}>{a[0]}</p><p style={{fontSize:26,fontWeight:500,color:a[2]}}>{a[1]!==null?a[1]:"—"}</p><p style={{fontSize:10,color:a[2],opacity:.7}}>sobre 4</p></div>)}
          </div>}
          {role==="profesor"?<div><p style={{fontSize:13,fontWeight:500,marginBottom:8}}>Feedback para el alumno</p><textarea value={s.feedback||""} onChange={e=>setFb(e.target.value)} placeholder="Puntos fuertes, áreas de mejora y recomendaciones..." style={{width:"100%",minHeight:130,fontSize:13,padding:"10px 12px",borderRadius:10,border:"0.5px solid #D5D2CC",background:"#F7F6F3",color:"#1A1A1A",resize:"vertical",lineHeight:1.6}}/></div>
          :s.feedback?<div style={{background:"linear-gradient(135deg,#EEEDFE,#E1F5EE)",borderRadius:14,padding:"1.25rem"}}><p style={{fontSize:12,fontWeight:500,color:"#0F6E56",marginBottom:8}}>💬 Feedback del profesor</p><p style={{fontSize:14,lineHeight:1.7}}>{s.feedback}</p></div>
          :<div style={{textAlign:"center",padding:"2rem",color:"#aaa"}}><div style={{fontSize:28,marginBottom:8}}>⏳</div><p style={{fontSize:13}}>El profesor aún no ha escrito feedback.</p></div>}
        </div>}
      </div>
    );
  }

  if(screen==="agenda"&&activeStudent){
    const ms=byMonth[agendaMonth]||[];const md=ms.length>0?ms[0].date:null;
    return(
      <div style={{maxWidth:700,margin:"0 auto",padding:"1.5rem 1rem"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <button onClick={()=>{setScreen("main");setMainTab("alumnos")}} style={{background:"none",border:"0.5px solid #D5D2CC",borderRadius:8,padding:"5px 12px",cursor:"pointer",fontSize:12,color:"#555"}}>← Alumnos</button>
          <p style={{flex:1,fontSize:15,fontWeight:500,color:acc}}>👤 {activeStudent.nombre}</p>
          <span style={{fontSize:12,color:"#888"}}>{done.length} completadas</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
          <button onClick={()=>setAgendaMonth(m=>Math.max(0,m-1))} disabled={agendaMonth===0} style={{background:"none",border:"0.5px solid #D5D2CC",borderRadius:8,padding:"4px 10px",cursor:"pointer",color:"#555",fontSize:13}}>‹</button>
          <p style={{flex:1,textAlign:"center",fontWeight:500,fontSize:14,textTransform:"capitalize"}}>{md?md.toLocaleDateString("es-ES",{month:"long",year:"numeric"}):"—"}</p>
          <button onClick={()=>setAgendaMonth(m=>Math.min(byMonth.length-1,m+1))} disabled={agendaMonth===byMonth.length-1} style={{background:"none",border:"0.5px solid #D5D2CC",borderRadius:8,padding:"4px 10px",cursor:"pointer",color:"#555",fontSize:13}}>›</button>
        </div>
        {ms.map(s=>{const sT=total(s.studentScores),pT=total(s.professorScores);return(
          <button key={s.id} onClick={()=>{setActiveSessionId(s.id);setEvalTab("professor");setScreen("session")}} style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"12px 14px",marginBottom:7,background:"#fff",border:"0.5px solid #E0DDD8",borderRadius:12,cursor:"pointer",textAlign:"left"}}>
            <div style={{width:46,height:46,borderRadius:10,background:accBg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:16,fontWeight:500,color:acc,lineHeight:1}}>{s.date.getDate()}</span><span style={{fontSize:10,color:acc,opacity:.75,textTransform:"capitalize"}}>{s.date.toLocaleDateString("es-ES",{weekday:"short"})}</span></div>
            <div style={{flex:1}}><p style={{fontSize:13,fontWeight:500,marginBottom:3,textTransform:"capitalize"}}>{fmt(s.date)}</p><Badge status={s.status}/></div>
            <div style={{display:"flex",gap:6}}>{sT!==null&&<Pill color={sCol(sT)} bg={sBg(sT)} small>🎓{sT}</Pill>}{pT!==null&&<Pill color={sCol(pT)} bg={sBg(pT)} small>👩‍⚕️{pT}</Pill>}</div>
            <span style={{fontSize:13,color:"#aaa"}}>›</span>
          </button>
        )})}
      </div>
    );
  }

  if(role==="profesor")return(
    <div style={{maxWidth:700,margin:"0 auto",padding:"1.5rem 1rem"}}>
      <div style={{background:accBg,borderRadius:16,padding:"1rem 1.25rem",marginBottom:18,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><p style={{fontSize:15,fontWeight:500,color:acc}}>👩‍⚕️ {profile&&profile.nombre}</p><p style={{fontSize:12,color:acc,opacity:.8}}>{asig||"Sin asignatura"} · {yr}-{parseInt(yr)+1}</p></div>
        <button onClick={doSignOut} style={{fontSize:12,padding:"6px 14px",borderRadius:20,border:"1px solid "+acc,background:"transparent",color:acc,cursor:"pointer"}}>Salir</button>
      </div>
      <div style={{display:"flex",gap:5,marginBottom:18}}>{[["alumnos","👥 Alumnos"],["resumen","📊 Resumen"]].map(t=><button key={t[0]} onClick={()=>setMainTab(t[0])} style={{fontSize:13,padding:"8px 18px",borderRadius:20,border:"none",cursor:"pointer",fontWeight:mainTab===t[0]?500:400,background:mainTab===t[0]?acc:"#EEECEA",color:mainTab===t[0]?"#fff":"#555"}}>{t[1]}</button>)}</div>
      {mainTab==="alumnos"&&<div>
        <div style={{marginBottom:12,padding:"12px 14px",background:"#EEEDFE",borderRadius:10}}>
          <p style={{fontSize:12,color:"#3C3489",fontWeight:500,marginBottom:4}}>💡 ¿Cómo aparecen los alumnos?</p>
          <p style={{fontSize:12,color:"#3C3489",opacity:.85}}>Los alumnos se registran con rol <b>Estudiante</b> y escriben la asignatura: <b>"{asig}"</b></p>
        </div>
        <button onClick={()=>loadStudents(asig)} style={{width:"100%",marginBottom:12,padding:"9px",borderRadius:10,border:"0.5px solid #D5D2CC",background:"#fff",color:"#555",fontSize:13,cursor:"pointer"}}>🔄 Actualizar lista</button>
        {students.length===0?<div style={{textAlign:"center",padding:"3rem 1rem",color:"#aaa"}}><div style={{fontSize:32,marginBottom:8}}>👥</div><p style={{fontSize:13}}>Aún no hay alumnos registrados.</p></div>
        :students.map(st=>{const comp=st.sessions.filter(s=>s.status==="completada");const pv=comp.map(s=>total(s.professorScores)).filter(Boolean);const pm=pv.length?(pv.reduce((a,b)=>a+b,0)/pv.length).toFixed(2):null;return(
          <button key={st.id} onClick={()=>{setActiveStudentId(st.id);setAgendaMonth(0);setScreen("agenda")}} style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"13px 15px",marginBottom:8,background:"#fff",border:"0.5px solid #E0DDD8",borderRadius:12,cursor:"pointer",textAlign:"left"}}>
            <div style={{width:42,height:42,borderRadius:21,background:accBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>👤</div>
            <div style={{flex:1}}><p style={{fontSize:14,fontWeight:500,marginBottom:3}}>{st.nombre}</p><p style={{fontSize:12,color:"#888"}}>{comp.length} sesiones completadas</p></div>
            {pm&&<Pill color={sCol(parseFloat(pm))} bg={sBg(parseFloat(pm))}>{pm}/4</Pill>}
            <span style={{fontSize:13,color:"#aaa"}}>›</span>
          </button>
        )})}
      </div>}
      {mainTab==="resumen"&&<div>
        {students.length===0?<div style={{textAlign:"center",padding:"3rem",color:"#aaa"}}><div style={{fontSize:32,marginBottom:8}}>📊</div><p style={{fontSize:13}}>No hay alumnos aún.</p></div>
        :<div>
          <div style={{background:"#fff",border:"0.5px solid #E0DDD8",borderRadius:14,overflow:"hidden",marginBottom:16}}>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",background:"#F7F6F3",padding:"10px 16px"}}>{["Alumno","Sesiones","Media alumno","Media profesor"].map(h=><p key={h} style={{fontSize:12,fontWeight:500,color:"#555",margin:0,textAlign:h!=="Alumno"?"center":"left"}}>{h}</p>)}</div>
            {students.map((st,idx)=>{const comp=st.sessions.filter(s=>s.status==="completada");const sv=comp.map(s=>total(s.studentScores)).filter(Boolean);const pv=comp.map(s=>total(s.professorScores)).filter(Boolean);const sm=sv.length?(sv.reduce((a,b)=>a+b,0)/sv.length).toFixed(2):null;const pm=pv.length?(pv.reduce((a,b)=>a+b,0)/pv.length).toFixed(2):null;return(
              <div key={st.id} style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",padding:"11px 16px",borderTop:idx>0?"0.5px solid #E0DDD8":"none",alignItems:"center"}}>
                <p style={{fontSize:13,fontWeight:500,margin:0}}>{st.nombre}</p>
                <p style={{fontSize:13,margin:0,textAlign:"center",color:"#555"}}>{comp.length}</p>
                <p style={{fontSize:14,fontWeight:500,margin:0,textAlign:"center",color:sCol(sm?parseFloat(sm):null)}}>{sm||"—"}</p>
                <p style={{fontSize:14,fontWeight:500,margin:0,textAlign:"center",color:sCol(pm?parseFloat(pm):null)}}>{pm||"—"}</p>
              </div>
            )})}
          </div>
          <button onClick={()=>exportXLS(students,asig,yr)} style={{width:"100%",padding:"13px",borderRadius:12,border:"none",background:"linear-gradient(135deg,#534AB7,#7F77DD)",color:"#fff",fontSize:14,fontWeight:500,cursor:"pointer"}}>⬇️ Exportar todos los alumnos a Excel (.csv)</button>
        </div>}
      </div>}
    </div>
  );

  if(role==="estudiante"){
    const ms=byMonth[agendaMonth]||[];const md=ms.length>0?ms[0].date:null;
    return(
      <div style={{maxWidth:700,margin:"0 auto",padding:"1.5rem 1rem"}}>
        <div style={{background:accBg,borderRadius:16,padding:"1rem 1.25rem",marginBottom:18,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><p style={{fontSize:15,fontWeight:500,color:acc}}>🎓 {profile&&profile.nombre}</p><p style={{fontSize:12,color:acc,opacity:.8}}>{asig||"Prácticas clínicas"}</p></div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{textAlign:"right"}}><p style={{fontSize:11,color:acc,opacity:.7,marginBottom:2}}>Completadas</p><p style={{fontSize:18,fontWeight:500,color:acc}}>{done.length}<span style={{fontSize:12,opacity:.7}}>/{mySessions.length}</span></p></div>
            <button onClick={doSignOut} style={{fontSize:11,padding:"5px 10px",borderRadius:16,border:"1px solid "+acc,background:"transparent",color:acc,cursor:"pointer"}}>Salir</button>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
          <button onClick={()=>setAgendaMonth(m=>Math.max(0,m-1))} disabled={agendaMonth===0} style={{background:"none",border:"0.5px solid #D5D2CC",borderRadius:8,padding:"4px 10px",cursor:"pointer",color:"#555",fontSize:13}}>‹</button>
          <p style={{flex:1,textAlign:"center",fontWeight:500,fontSize:14,textTransform:"capitalize"}}>{md?md.toLocaleDateString("es-ES",{month:"long",year:"numeric"}):"—"}</p>
          <button onClick={()=>setAgendaMonth(m=>Math.min(byMonth.length-1,m+1))} disabled={agendaMonth===byMonth.length-1} style={{background:"none",border:"0.5px solid #D5D2CC",borderRadius:8,padding:"4px 10px",cursor:"pointer",color:"#555",fontSize:13}}>›</button>
        </div>
        {ms.map(s=>{const sT=total(s.studentScores);return(
          <button key={s.id} onClick={()=>{setActiveSessionId(s.id);setEvalTab("student");setScreen("session")}} style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"12px 14px",marginBottom:7,background:"#fff",border:"0.5px solid #E0DDD8",borderRadius:12,cursor:"pointer",textAlign:"left"}}>
            <div style={{width:46,height:46,borderRadius:10,background:accBg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:16,fontWeight:500,color:acc,lineHeight:1}}>{s.date.getDate()}</span><span style={{fontSize:10,color:acc,opacity:.75,textTransform:"capitalize"}}>{s.date.toLocaleDateString("es-ES",{weekday:"short"})}</span></div>
            <div style={{flex:1}}><p style={{fontSize:13,fontWeight:500,marginBottom:3,textTransform:"capitalize"}}>{fmt(s.date)}</p><Badge status={s.status}/></div>
            {sT!==null&&<Pill color={sCol(sT)} bg={sBg(sT)} small>🎓{sT}</Pill>}
            {s.feedback&&<span style={{fontSize:16}}>💬</span>}
            <span style={{fontSize:13,color:"#aaa"}}>›</span>
          </button>
        )})}
      </div>
    );
  }
  return null;
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
